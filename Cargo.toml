[package]
name = "dsh-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_Security", "Win32_System_SystemInformation"] }

[build-dependencies]
embed-resource = "3.0.12"
